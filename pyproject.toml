[tool.mypy]
python_version = "3.10"
show_error_codes = true
pretty = true

disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
strict_optional = true

ignore_missing_imports = false

exclude = [
  "^tests/",
  "^scripts/",
]
# mypy HTML report is controlled via CLI: --html-report .

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
