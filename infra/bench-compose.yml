services:
  # --- MongoDB (benchmarks) ---
  mongo:
    image: mongo:7.0
    container_name: bench_mongo
    command: [ "mongod", "--replSet", "rs0", "--bind_ip_all" ]
    ports:
      - "27017:27017"
    volumes:
      - bench_mongo_data:/data/db
      - ../scripts:/scripts:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval \"try { quit(db.hello().isWritablePrimary ? 0 : 1) } catch (e) { quit(1) }\""
        ]
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 60

  mongo-rs-init:
    image: mongo:7.0
    depends_on:
      mongo:
        condition: service_started
    entrypoint: >
      bash -lc "
        echo 'waiting for mongod...';
        for i in {1..60}; do
          mongosh mongodb://mongo:27017 --quiet --eval \"db.adminCommand('ping')\" >/dev/null 2>&1 && break;
          sleep 1;
        done;
      
        echo 'init replset (idempotent)...';
        mongosh mongodb://mongo:27017 --quiet --eval \"
          try {
            st = rs.status();
            if (st.ok) { print('replset already ok'); quit(0); }
          } catch (e) { /* not initialized */ }
      
          try {
            rs.initiate({_id: 'rs0', members: [{ _id: 0, host: 'mongo:27017'}]});
          } catch (e) {
            print(e);
          }
        \";
      
        echo 'waiting for primary...';
        for i in {1..60}; do
          mongosh mongodb://mongo:27017 --quiet --eval \"try { quit(db.hello().isWritablePrimary ? 0 : 1) } catch (e) { quit(1) }\" && exit 0;
          sleep 1;
        done;
      
        echo 'replset not ready in time'; exit 1;
      "
    restart: "no"

  # --- PostgreSQL (benchmarks) ---
  postgres:
    image: postgres:16
    container_name: bench_postgres
    environment:
      POSTGRES_DB: bench
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
    ports:
      - "5432:5432"
    volumes:
      - bench_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench -d bench"]
      interval: 5s
      timeout: 5s
      retries: 20

  # --- Runner for benchmark/seed scripts ---
  bench:
    build:
      context: ..
      dockerfile: scripts/bench/Dockerfile.bench
    image: ugc-bench:latest
    container_name: bench_runner
    working_dir: /app
    volumes:
      - ../scripts:/app/scripts:rw   # Mount code; dependencies are already baked into the image
    depends_on:
      mongo:
        condition: service_started
      mongo-rs-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      MONGO_DSN: mongodb://mongo:27017/engagement_bench?replicaSet=rs0
      PG_DSN: postgresql://bench:bench@postgres:5432/bench
      TOTAL: 200000
      FILMS: 2000
      BATCH: 10000
      CSV_BATCH: 100000
    command: >
      bash -lc "python -V && echo 'bench ready'"

volumes:
  bench_mongo_data:
  bench_pg_data:
