# All variables are loaded from infra/.env
# e.g. APP_PORT, MONGO_DSN, POSTGRES_USER, etc.

services:
  api:
    build:
      context: ..
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.11}
    container_name: engagement_api
    env_file: [.env]
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      mongo:
        condition: service_healthy
      mongo-rs-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    volumes:
      - ../logs/api:/var/log/app
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health').read()\"" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  mongo:
    image: mongo:7.0
    container_name: engagement_mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: [
        "CMD-SHELL",
        "mongosh --quiet --eval 'try { db.adminCommand({ ping: 1 }).ok ? quit(0) : quit(1) } catch(e){ quit(1) }'"
      ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # One-shot helper to initiate the replica set
  mongo-rs-init:
    image: mongo:7.0
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint: >
      bash -lc '
        set -euo pipefail

        echo "[rs-init] starting"

        if mongosh "mongodb://mongo:27017" --quiet --eval "try{quit(rs.status().ok?0:1)}catch(e){quit(1)}" >/dev/null 2>&1; then
          echo "[rs-init] already initialized"
          exit 0
        fi

        echo "[rs-init] initiating rs0..."
        mongosh "mongodb://mongo:27017" --quiet --eval "
          try {
            rs.initiate({_id:\"rs0\", members:[{_id:0, host:\"mongo:27017\"}]});
          } catch (e) {}
        " >/dev/null

        echo "[rs-init] waiting for PRIMARY..."
        for i in {1..90}; do
          mongosh "mongodb://mongo:27017" --quiet --eval "db.hello().setName + \" \" + db.hello().isWritablePrimary" 2>/dev/null \
            | grep -q "rs0 true" && echo "[rs-init] PRIMARY ready" && exit 0
          sleep 1
        done

        echo "[rs-init] PRIMARY not ready (timeout)"
        exit 1
      '
    restart: "no"

  redis:
    image: redis:7
    container_name: engagement_redis
    restart: unless-stopped

  elasticsearch:
    profiles: ["elk"]
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: engagement_es
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
       # Local dev: disable security to avoid auth setup
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    restart: unless-stopped
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -q '\"status\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  kibana:
    profiles: ["elk"]
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: engagement_kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    volumes:
      - kibana_data:/usr/share/kibana/data
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  logstash:
    profiles: ["elk"]
    image: docker.elastic.co/logstash/logstash:8.15.0
    container_name: engagement_logstash
    ports:
      - "5044:5044"
    volumes:
      - ./elk/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  filebeat:
    profiles: ["elk"]
    image: docker.elastic.co/beats/filebeat:8.15.0
    container_name: engagement_filebeat
    user: root
    command: [ "-e", "--strict.perms=false" ]   # stdout logs + ignore strict perms
    volumes:
      - ./elk/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - filebeat_data:/usr/share/filebeat/data
    depends_on:
      logstash:
        condition: service_started
    restart: unless-stopped


volumes:
  mongo_data:
  es_data:
  kibana_data:
  filebeat_data:
