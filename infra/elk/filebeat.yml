filebeat.inputs:
  - type: container
    enabled: true
    paths:
      - /var/lib/docker/containers/*/*.log
    processors:
      - add_docker_metadata: ~
      # Keep only our API container
      - drop_event:
          when:
            not:
              equals:
                container.name: "engagement_api"
      # Safely decode JSON from the message field
      - decode_json_fields:
          fields: ["message"]
          target: ""  # into root
          overwrite_keys: true
          add_error_key: true

output.logstash:
  hosts: ["logstash:5044"]

setup.template.enabled: false
setup.ilm.enabled: false
