name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dev deps (host tools)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt
          pip install lxml
          mkdir -p reports/mypy


      - name: Ruff
        run: |
          python -m ruff check .

      - name: Mypy (non-blocking) + HTML report
        run: |
          python -m mypy ugc_api --html-report reports/mypy

      # --- Integration tests via Docker Compose (same as local) ---
      - name: Docker info
        run: docker version && docker compose version

      - name: Prepare infra env
        run: |
          cp infra/.env.sample infra/.env

      - name: Set python version for docker build (compose)
        run: |
          echo "PYTHON_VERSION=${{ matrix.python-version }}" >> $GITHUB_ENV

      - name: Build & start stack
        run: |
          make up
          docker compose -f infra/docker-compose.yml ps

      - name: Run tests in api container
        run: |
          docker compose -f infra/docker-compose.yml exec -T api bash -lc '\
            python -m pip install -q -r requirements/dev.txt; \
            export MONGO_DSN="mongodb://mongo:27017/engagement_test?replicaSet=rs0"; \
            python scripts/create_indexes.py; \
            python -m pytest -v --disable-warnings \
              --cov=ugc_api --cov-report=term-missing \
              --cov-config=.coveragerc --cov-fail-under=90 \
          '

      - name: Upload mypy report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ matrix.python-version }}
          path: reports/

      - name: Shutdown stack
        if: always()
        run: |
          make down
          docker ps -a
